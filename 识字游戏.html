<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>生词消消乐 · 平板优化版</title>
    <style>
        /* ===== 平板适配核心样式 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #d9f2d0;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
            overscroll-behavior: none;
        }
        
        .game-wrapper {
            width: 100%;
            max-width: 1200px;
            height: 100%;
            max-height: 100vh;
            background: rgba(235, 250, 220, 0.55);
            backdrop-filter: blur(2px);
            border-radius: 30px;
            padding: 15px 20px;
            box-shadow: 0 12px 30px rgba(80, 110, 70, 0.25);
            border: 2px solid #b6d7a8;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            letter-spacing: 4px;
            text-align: center;
            color: #2d5e2c;
            text-shadow: 3px 3px 0 #c0e0b0, 5px 5px 0 rgba(0,0,0,0.1);
            margin: 0 0 10px 0;
            font-weight: 800;
            flex-shrink: 0;
        }
        
        /* ===== 上传区域 - 平板友好 ===== */
        .upload-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: #e5f4db;
            padding: 10px 15px;
            border-radius: 40px;
            margin-bottom: 10px;
            border: 2px solid #9dc98d;
            flex-shrink: 0;
        }
        
        .upload-btn {
            background: #3d7a37;
            color: white;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: 600;
            padding: 12px 25px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1d461b;
            transition: 0.1s;
            border: 2px solid #a5d69a;
            display: inline-block;
            min-height: 44px;
            min-width: 44px;
        }
        
        .upload-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1d461b;
        }
        
        .upload-area input[type="file"] {
            display: none;
        }
        
        .upload-status {
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #1e4a1a;
            font-weight: 600;
            background: #f0fae8;
            padding: 8px 12px;
            border-radius: 30px;
            border: 1px solid #7baa6a;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* ===== 计时器 ===== */
        .timer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: 600;
            color: #1e4a1a;
            background: #e5f4db;
            padding: 10px 20px;
            border-radius: 40px;
            border: 2px solid #9dc98d;
            flex-shrink: 0;
        }
        
        #timer {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 700;
            background: #2c5e2a;
            color: #f9ffe9;
            padding: 5px 15px;
            border-radius: 40px;
            letter-spacing: 1px;
        }
        
        /* ===== 泡泡网格 - 平板自适应 ===== */
        .bubble-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: clamp(10px, 2vw, 20px);
            justify-content: center;
            align-items: center;
            margin: 5px 0 15px;
            padding: 5px;
            flex: 1;
            min-height: 0;
        }
        
        .bubble {
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: 120px;
            margin: 0 auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
            background: radial-gradient(circle at 30% 25%, #fff9, #ffffff10 45%, #00000030);
            box-shadow: 0 12px 15px rgba(0,0,0,0.25), inset 0 -8px 12px rgba(0,0,0,0.2), inset 0 8px 12px rgba(255,255,255,0.6);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.2s;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.35);
            background-blend-mode: overlay;
            line-height: 1;
            word-break: break-word;
            padding: 0 5px;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* 触控反馈优化 */
        .bubble:active {
            transform: scale(0.95);
            filter: brightness(0.95);
        }
        
        .bubble.selected {
            filter: brightness(1.15) saturate(1.2);
            box-shadow: 0 0 0 6px #ffe484, 0 12px 20px rgba(0,0,0,0.3), inset 0 -6px 10px rgba(0,0,0,0.2);
            transform: scale(1.02);
        }
        
        .bubble.matched-hidden {
            visibility: hidden;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.2);
            transition: visibility 0.2s, opacity 0.2s, transform 0.25s;
        }
        
        .bubble span {
            display: block;
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 900;
            text-shadow: 2px 2px 0 #00000055;
            transform: rotate(-2deg);
            pointer-events: none;
        }
        
        /* ===== 控制区域 ===== */
        .control-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
            flex-shrink: 0;
        }
        
        .btn {
            background: #3d7a37;
            color: white;
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            box-shadow: 0 8px 0 #1d461b, 0 10px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: 0.1s linear;
            letter-spacing: 2px;
            border: 2px solid #a5d69a;
            min-height: 50px;
            min-width: 120px;
        }
        
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #1d461b, 0 6px 10px rgba(0,0,0,0.2);
        }
        
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(3px);
            box-shadow: 0 4px 0 #1d461b;
            pointer-events: none;
        }
        
        .message-success {
            background: #eaffe0;
            border-radius: 30px;
            padding: 15px 20px;
            margin: 10px 0;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 800;
            color: #1e5e1e;
            text-align: center;
            border: 3px dashed #6f9e5c;
            box-shadow: 0 5px 0 #b8d9a8;
            flex-shrink: 0;
        }
        
        #successMessage {
            display: none;
        }
        
        #successMessage.show {
            display: block;
        }
        
        .footer-note {
            margin-top: 5px;
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            color: #3f653a;
            text-align: center;
            flex-shrink: 0;
        }
        
        /* ===== 平板横屏/竖屏适配 ===== */
        @media (orientation: landscape) and (max-height: 600px) {
            .game-wrapper {
                padding: 10px 15px;
            }
            .bubble-grid {
                gap: 8px;
            }
            .bubble {
                font-size: 1.2rem;
            }
            .bubble span {
                font-size: 1.2rem;
            }
        }
        
        /* ===== 安全区域适配（全面屏平板） ===== */
        @supports (padding: env(safe-area-inset-bottom)) {
            body {
                padding-bottom: env(safe-area-inset-bottom);
                padding-top: env(safe-area-inset-top);
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
        }
        
        /* ===== 滚动优化 ===== */
        .game-wrapper::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        .game-wrapper::-webkit-scrollbar-thumb {
            background: #7baa6a;
            border-radius: 10px;
        }
        
        .game-wrapper::-webkit-scrollbar-track {
            background: #e5f4db;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <h1>✨ 生词消消乐 ✨</h1>
    
    <!-- 拍照/图片上传区域 -->
    <div class="upload-area">
        <label for="imageUpload" class="upload-btn">📷 拍照/识别生词表</label>
        <input type="file" id="imageUpload" accept="image/*" capture="environment">
        <span class="upload-status" id="uploadStatus">内置字库 · 可拍照更新</span>
    </div>

    <div class="timer-bar">
        <span>⏱️ 用时</span>
        <span id="timer">0.0 秒</span>
    </div>

    <div id="bubbleGrid" class="bubble-grid"></div>

    <div id="successMessage" class="message-success">
        🎉 恭喜挑战成功！ 🎉<br> 用时 <span id="finalTime">0.0</span> 秒
    </div>

    <div class="control-area">
        <button id="continueBtn" class="btn">🔁 继续挑战</button>
    </div>
    <div class="footer-note">点击两个泡泡配对 · 配对成功自动读汉字 🔊</div>
</div>

<script>
    (function() {
        // ---------- 内置生字库（默认）----------
        const DEFAULT_WORDS = [
            { char: '春', pinyin: 'chūn' }, { char: '夏', pinyin: 'xià' },
            { char: '秋', pinyin: 'qiū' }, { char: '冬', pinyin: 'dōng' },
            { char: '风', pinyin: 'fēng' }, { char: '雨', pinyin: 'yǔ' },
            { char: '雪', pinyin: 'xuě' }, { char: '霜', pinyin: 'shuāng' },
            { char: '山', pinyin: 'shān' }, { char: '水', pinyin: 'shuǐ' },
            { char: '花', pinyin: 'huā' }, { char: '草', pinyin: 'cǎo' },
            { char: '鸟', pinyin: 'niǎo' }, { char: '虫', pinyin: 'chóng' },
            { char: '鱼', pinyin: 'yú' }, { char: '日', pinyin: 'rì' },
            { char: '月', pinyin: 'yuè' }, { char: '星', pinyin: 'xīng' },
            { char: '云', pinyin: 'yún' }, { char: '海', pinyin: 'hǎi' },
            { char: '天', pinyin: 'tiān' }, { char: '地', pinyin: 'dì' },
            { char: '人', pinyin: 'rén' }, { char: '口', pinyin: 'kǒu' },
            { char: '手', pinyin: 'shǒu' }, { char: '足', pinyin: 'zú' },
            { char: '目', pinyin: 'mù' }, { char: '耳', pinyin: 'ěr' },
            { char: '舌', pinyin: 'shé' }, { char: '牙', pinyin: 'yá' },
            { char: '心', pinyin: 'xīn' }, { char: '木', pinyin: 'mù' },
            { char: '林', pinyin: 'lín' }, { char: '森', pinyin: 'sēn' },
            { char: '火', pinyin: 'huǒ' }, { char: '土', pinyin: 'tǔ' },
            { char: '石', pinyin: 'shí' }, { char: '金', pinyin: 'jīn' },
            { char: '玉', pinyin: 'yù' }, { char: '宝', pinyin: 'bǎo' },
            { char: '贝', pinyin: 'bèi' }, { char: '刀', pinyin: 'dāo' },
            { char: '尺', pinyin: 'chǐ' }, { char: '寸', pinyin: 'cùn' },
            { char: '元', pinyin: 'yuán' }, { char: '角', pinyin: 'jiǎo' },
            { char: '分', pinyin: 'fēn' }, { char: '大', pinyin: 'dà' },
            { char: '小', pinyin: 'xiǎo' }, { char: '多', pinyin: 'duō' },
            { char: '少', pinyin: 'shǎo' }, { char: '来', pinyin: 'lái' },
            { char: '去', pinyin: 'qù' }, { char: '上', pinyin: 'shàng' },
            { char: '下', pinyin: 'xià' }, { char: '左', pinyin: 'zuǒ' },
            { char: '右', pinyin: 'yòu' }, { char: '前', pinyin: 'qián' },
            { char: '后', pinyin: 'hòu' }, { char: '中', pinyin: 'zhōng' },
            { char: '外', pinyin: 'wài' }, { char: '里', pinyin: 'lǐ' },
            { char: '开', pinyin: 'kāi' }, { char: '关', pinyin: 'guān' },
            { char: '门', pinyin: 'mén' }, { char: '车', pinyin: 'chē' },
            { char: '马', pinyin: 'mǎ' }, { char: '牛', pinyin: 'niú' },
            { char: '羊', pinyin: 'yáng' }, { char: '鸡', pinyin: 'jī' },
            { char: '狗', pinyin: 'gǒu' }, { char: '猫', pinyin: 'māo' },
            { char: '兔', pinyin: 'tù' }, { char: '龙', pinyin: 'lóng' },
            { char: '虎', pinyin: 'hǔ' }, { char: '象', pinyin: 'xiàng' },
            { char: '熊', pinyin: 'xióng' }, { char: '鹿', pinyin: 'lù' }
        ];

        const defaultUnique = new Map();
        DEFAULT_WORDS.forEach(item => {
            if (!defaultUnique.has(item.char)) {
                defaultUnique.set(item.char, item.pinyin);
            }
        });
        const BASE_WORDS = Array.from(defaultUnique.entries()).map(([char, pinyin]) => ({ char, pinyin }));

        // 当前使用的词库
        let activeWordList = BASE_WORDS;

        // 游戏状态
        let currentItems = [];
        let selectedIndex = null;
        let startTime = null;
        let timerInterval = null;
        let gameFinished = false;
        let totalSeconds = 0;

        // DOM
        const gridEl = document.getElementById('bubbleGrid');
        const timerEl = document.getElementById('timer');
        const successMsg = document.getElementById('successMessage');
        const finalTimeSpan = document.getElementById('finalTime');
        const continueBtn = document.getElementById('continueBtn');
        const imageUpload = document.getElementById('imageUpload');
        const uploadStatus = document.getElementById('uploadStatus');

        // ---------- 精准发音：直接读汉字 ----------
        function speakCharacter(character) {
            if (!('speechSynthesis' in window)) {
                console.warn('浏览器不支持语音');
                return;
            }
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(character);
            const voices = window.speechSynthesis.getVoices();
            const zhVoices = voices.filter(voice => 
                voice.lang.toLowerCase().includes('zh-cn') || voice.lang.toLowerCase().includes('zh_cn') || voice.lang.toLowerCase().includes('zh')
            );
            
            if (zhVoices.length > 0) {
                const preferred = zhVoices.find(voice => 
                    voice.name.includes('Huihui') || voice.name.includes('Xiaoxiao') || 
                    voice.name.includes('Yunxi') || voice.name.includes('Yunyang') || 
                    voice.name.includes('Microsoft') || voice.name.includes('Lili') ||
                    voice.name.includes('Tingting')
                );
                utterance.voice = preferred || zhVoices[0];
            }
            
            utterance.lang = 'zh-CN';
            utterance.rate = 0.85;
            utterance.pitch = 1.1;
            utterance.volume = 1.0;
            
            window.speechSynthesis.speak(utterance);
        }

        // 工具函数
        function formatTime(sec) {
            return sec.toFixed(1);
        }

        function randomBubbleColor() {
            const hue = Math.floor(Math.random() * 360);
            const sat = 55 + Math.floor(Math.random() * 30);
            const light = 55 + Math.floor(Math.random() * 20);
            return `hsl(${hue} ${sat}% ${light}%)`;
        }

        // 生成泡泡
        function generateRandomPairs() {
            const count = Math.min(activeWordList.length, 9);
            const shuffled = [...activeWordList].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, count);
            const bubbles = [];
            selected.forEach((item, idx) => {
                bubbles.push({
                    id: `c-${idx}-${item.char}`,
                    type: 'char',
                    char: item.char,
                    pinyin: item.pinyin,
                    matched: false,
                });
                bubbles.push({
                    id: `p-${idx}-${item.pinyin}`,
                    type: 'pinyin',
                    char: item.char,
                    pinyin: item.pinyin,
                    matched: false,
                });
            });
            for (let i = bubbles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [bubbles[i], bubbles[j]] = [bubbles[j], bubbles[i]];
            }
            return bubbles;
        }

        // 渲染网格
        function renderGrid() {
            gridEl.innerHTML = '';
            currentItems.forEach((item, index) => {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                if (item.matched) {
                    bubble.classList.add('matched-hidden');
                }
                bubble.style.background = `radial-gradient(circle at 30% 25%, #ffffff90, ${randomBubbleColor()} 60%, #00000025)`;
                const content = document.createElement('span');
                content.textContent = item.type === 'char' ? item.char : item.pinyin;
                bubble.appendChild(content);
                bubble.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleBubbleClick(index);
                });
                if (selectedIndex === index && !item.matched) {
                    bubble.classList.add('selected');
                }
                gridEl.appendChild(bubble);
            });
        }

        // 点击处理
        function handleBubbleClick(index) {
            if (gameFinished) return;
            const item = currentItems[index];
            if (item.matched) return;

            if (selectedIndex !== null) {
                if (selectedIndex === index) {
                    clearSelected();
                    return;
                }
                const firstItem = currentItems[selectedIndex];
                const secondItem = item;
                const isMatch = (
                    (firstItem.type !== secondItem.type) &&
                    (firstItem.char === secondItem.char) &&
                    (firstItem.pinyin === secondItem.pinyin)
                );

                if (isMatch) {
                    speakCharacter(firstItem.char);
                    firstItem.matched = true;
                    secondItem.matched = true;
                    clearSelected(false);
                    renderGrid();
                    checkAllMatched();
                } else {
                    clearSelected(true);
                }
            } else {
                selectedIndex = index;
                renderGrid();
            }
        }

        function clearSelected(render = true) {
            selectedIndex = null;
            if (render) renderGrid();
        }

        function checkAllMatched() {
            const allMatched = currentItems.every(item => item.matched);
            if (allMatched) {
                gameFinished = true;
                stopTimer();
                successMsg.classList.add('show');
                finalTimeSpan.textContent = formatTime(totalSeconds);
            }
        }

        // 计时器
        function startTimer() {
            stopTimer();
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                totalSeconds = elapsed;
                timerEl.textContent = formatTime(elapsed) + ' 秒';
            }, 100);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // 新游戏
        function newGame() {
            currentItems = generateRandomPairs();
            selectedIndex = null;
            gameFinished = false;
            successMsg.classList.remove('show');
            stopTimer();
            totalSeconds = 0;
            timerEl.textContent = '0.0 秒';
            renderGrid();
            startTimer();
        }

        // 继续挑战
        function continueChallenge() {
            newGame();
        }

        // ---------- 图片录入 ----------
        function handleImageUpload(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const imgDataUrl = e.target.result;
                const modalHtml = `
                    <div style="position:fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:999;display:flex;justify-content:center;align-items:center;padding:20px;">
                        <div style="background:#f0fae8; padding:20px; border-radius:20px; max-width:500px; width:100%; box-shadow:0 10px 20px rgba(0,0,0,0.3); max-height:90vh; overflow-y:auto;">
                            <h3 style="color:#2d5e2c; margin-bottom:10px;">📖 请确认生词表</h3>
                            <img src="${imgDataUrl}" style="max-width:100%; max-height:200px; border-radius:10px; margin-bottom:15px; object-fit:contain;">
                            <p style="font-size:0.9rem; color:#1e4a1a;">若图片已识别，可手动输入或粘贴生词（每行：汉字,拼音）</p>
                            <textarea id="ocrTextArea" rows="6" style="width:100%; border-radius:10px; border:2px solid #9dc98d; padding:10px; font-size:1rem; min-height:120px;"></textarea>
                            <div style="display:flex; gap:10px; margin-top:15px; justify-content:flex-end;">
                                <button id="cancelOcr" style="background:#aaa; border:none; padding:12px 25px; border-radius:30px; color:white; font-weight:bold; min-height:44px;">取消</button>
                                <button id="confirmOcr" style="background:#3d7a37; border:none; padding:12px 25px; border-radius:30px; color:white; font-weight:bold; min-height:44px;">使用此词库</button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHtml);

                document.getElementById('cancelOcr').addEventListener('click', () => {
                    document.body.lastChild.remove();
                });
                document.getElementById('confirmOcr').addEventListener('click', () => {
                    const text = document.getElementById('ocrTextArea').value.trim();
                    if (text) {
                        const parsed = parseTextToWords(text);
                        if (parsed.length > 0) {
                            activeWordList = parsed;
                            uploadStatus.textContent = `已从图片录入 ${parsed.length} 个生字`;
                            newGame();
                        } else {
                            alert('未解析到有效生字，请检查格式');
                        }
                    } else {
                        alert('请输入生词表内容');
                    }
                    document.body.lastChild.remove();
                });
            };
            reader.readAsDataURL(file);
        }

        // 解析文本为词库
        function parseTextToWords(text) {
            const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
            const parsedWords = [];
            const seenChars = new Set();
            lines.forEach(line => {
                let parts = line.split(/[,\t，;；]+/).map(s => s.trim());
                if (parts.length >= 2) {
                    let charPart = parts[0];
                    let pinyinPart = parts[1];
                    if (/[a-zA-Z]/.test(charPart) && !/[a-zA-Z]/.test(pinyinPart)) {
                        [charPart, pinyinPart] = [pinyinPart, charPart];
                    }
                    charPart = charPart.replace(/['"']/g, '');
                    pinyinPart = pinyinPart.replace(/['"']/g, '');
                    const char = charPart.charAt(0);
                    if (char && pinyinPart && !seenChars.has(char)) {
                        const pinyin = pinyinPart.toLowerCase().trim();
                        if (pinyin.length > 0) {
                            seenChars.add(char);
                            parsedWords.push({ char, pinyin });
                        }
                    }
                } else {
                    const partsSpace = line.split(/\s+/).filter(s => s.trim() !== '');
                    if (partsSpace.length >= 2) {
                        let charPart = partsSpace[0];
                        let pinyinPart = partsSpace[1];
                        if (/[a-zA-Z]/.test(charPart) && !/[a-zA-Z]/.test(pinyinPart)) {
                            [charPart, pinyinPart] = [pinyinPart, charPart];
                        }
                        charPart = charPart.replace(/['"']/g, '');
                        pinyinPart = pinyinPart.replace(/['"']/g, '');
                        const char = charPart.charAt(0);
                        if (char && pinyinPart && !seenChars.has(char)) {
                            const pinyin = pinyinPart.toLowerCase().trim();
                            if (pinyin.length > 0) {
                                seenChars.add(char);
                                parsedWords.push({ char, pinyin });
                            }
                        }
                    }
                }
            });
            return parsedWords;
        }

        // 图片上传事件
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleImageUpload(file);
                imageUpload.value = '';
            }
        });

        // 继续按钮
        continueBtn.addEventListener('click', continueChallenge);

        // 初始化语音
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // 初始化
        newGame();
    })();
