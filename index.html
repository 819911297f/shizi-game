<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生词消消乐 · 人教版四上全册</title>
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.0/dist/index.js"></script>
    <style>
        /* --- 基础样式：完全复刻截图风格 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #d9f2d0; /* 截图中的浅绿背景 */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* --- 主容器 --- */
        .wrap {
            width: 100%;
            max-width: 900px; /* 限制最大宽度，适配平板 */
            height: 100%;
            background: rgba(235, 250, 220, 0.8);
            border: 2px solid #b6d7a8;
            border-radius: 28px;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 30px rgba(80, 110, 70, 0.25);
            position: relative;
            overflow: hidden;
        }

        /* --- 标题 --- */
        h1 {
            font-size: clamp(24px, 4vw, 36px);
            color: #2d5e2c;
            text-align: center;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 #fff;
            letter-spacing: 2px;
        }

        /* --- 顶部控制栏 --- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.6);
            padding: 12px;
            border-radius: 20px;
            border: 2px solid #c0e0b0;
        }

        .btn {
            background: #4a7c59;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 15px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 0 #2d5038;
            transition: all 0.1s;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #2d5038;
        }
        
        .btn.apply { background: #2e8b57; }
        .btn.custom { background: #3cb371; }

        select {
            padding: 8px 12px;
            border-radius: 15px;
            border: 2px solid #b6d7a8;
            background: white;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .status-tag {
            font-size: 12px;
            color: #2d5e2c;
            background: rgba(255,255,255,0.8);
            padding: 4px 10px;
            border-radius: 10px;
            margin-top: 5px;
            text-align: center;
            width: 100%;
        }

        /* --- 计时器 --- */
        .timer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e8f5e9;
            padding: 8px 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 2px solid #c0e0b0;
        }

        .timer-label {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .timer-value {
            background: #2d5e2c;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            min-width: 60px;
            text-align: center;
        }

        /* --- 核心游戏区：5列网格布局 --- */
        .game-board {
            flex: 1;
            display: grid;
            /* 关键：5列网格，自动填充，间距10px */
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 5px;
            overflow-y: auto;
            align-content: start;
        }

        /* --- 泡泡样式：统一大小，带阴影 --- */
        .bubble {
            width: 100%;
            aspect-ratio: 1 / 1; /* 保持绝对圆形 */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 16px; /* 字号适中 */
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.3);
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s, opacity 0.3s;
            box-shadow: 
                inset 0 -5px 10px rgba(0,0,0,0.1),
                0 4px 5px rgba(0,0,0,0.2);
            word-break: break-all;
            line-height: 1.2;
            padding: 5px;
            /* 渐变色背景 */
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0) 40%), 
                        linear-gradient(145deg, var(--color1), var(--color2));
        }

        .bubble:active {
            transform: scale(0.95);
        }

        .bubble.matched {
            animation: pop 0.3s ease-out forwards;
        }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* --- 底部按钮 --- */
        .bottom-area {
            margin-top: 15px;
            text-align: center;
        }

        .btn-primary {
            background: #2d5e2c;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #1a3a18;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: 80%;
            max-width: 300px;
            justify-content: center;
        }

        .btn-primary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1a3a18;
        }

        .hint {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
            height: 20px;
        }

        /* --- 平板/横屏适配 --- */
        @media (min-width: 768px) {
            .bubble {
                font-size: 18px;
            }
            h1 {
                font-size: 32px;
            }
        }

        @media (max-width: 600px) {
            .game-board {
                grid-template-columns: repeat(4, 1fr); /* 小屏幕改为4列 */
            }
        }

        @media (max-width: 400px) {
            .game-board {
                grid-template-columns: repeat(3, 1fr); /* 极小屏幕改为3列 */
            }
        }

        /* --- 声音解锁遮罩 --- */
        #unlock-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 18px;
            text-align: center;
            padding: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="50" y="50" font-size="10" fill="white">点击屏幕</text><text x="50" y="65" font-size="10" fill="white">开启声音</text></svg>');
            background-repeat: no-repeat;
            background-position: center 40%;
        }
    </style>
</head>
<body>

    <h1>✨ 生词消消乐 · 全册 ✨</h1>
    
    <div class="controls">
        <div style="display: flex; align-items: center; gap: 5px;">

            { word: "掩护", pinyin: "yǎn hù" },

    // === 全局变量 ===
    let currentItems = []; // 当前生成的泡泡数组
    let selectedItem = null; // 当前选中的泡泡
    let matchedPairs = 0; // 已匹配的对数
    let totalPairs = 0; // 总对数
    let startTime = 0; // 开始时间
    let timerInterval = null; // 计时器
    let soundEnabled = false; // 声音开关
    let currentUnit = "all"; // 当前单元

    // === DOM 元素 ===
    const gameBoard = document.getElementById('game-board');
    const timerEl = document.getElementById('timer');
    const unitSelect = document.getElementById('unit-select');
    const applyBtn = document.getElementById('apply-btn');
    const statusTag = document.getElementById('status-tag');
    const nextBtn = document.getElementById('next-btn');
    const hintEl = document.getElementById('hint');
    const unlockOverlay = document.getElementById('unlock-overlay');

    // === 初始化 ===
    document.addEventListener('DOMContentLoaded', () => {
        // 1. 初始化内置词库（合并全册）
        initAllVocab();
        
        // 2. 生成第一局游戏
        generateGame();

        // 3. 事件监听
        applyBtn.addEventListener('click', applyUnit);
        nextBtn.addEventListener('click', generateGame);
        unlockOverlay.addEventListener('click', unlockSound);
        
        // 4. 自动尝试解锁声音
        tryUnlockSound();
    });

    // === 功能函数 ===
    
    // 合并全册词库
    function initAllVocab() {
        let all = [];
        for(let key in vocabData) {
            all = all.concat(vocabData[key]);
        }
        vocabData.all = all;
    }

    // 应用单元选择
    function applyUnit() {
        currentUnit = unitSelect.value;
        statusTag.textContent = `人教版四上 · ${unitSelect.options[unitSelect.selectedIndex].text}`;
        generateGame();
    }

    // 生成游戏泡泡
    function generateGame() {
        stopTimer();
        resetGameState();
        
        let sourceData = vocabData[currentUnit];
        
        if (!sourceData || sourceData.length === 0) {
            alert("当前词库为空！");
            return;
        }
        
        // 随机打乱顺序
        shuffleArray(sourceData);
        
        // 计算需要多少对（最多取20对，即40个泡泡，防止屏幕溢出）
        totalPairs = Math.min(10, Math.floor(sourceData.length / 2));
        let itemsToShow = [];
        
        for(let i = 0; i < totalPairs; i++) {
            let item = sourceData[i];
            itemsToShow.push({
                id: i + '_w',
                text: item.word,
                type: 'word',
                pairId: i
            });
            itemsToShow.push({
                id: i + '_p',
                text: item.pinyin,
                type: 'pinyin',
                pairId: i
            });
        }
        
        // 如果不足20个，补充一些随机的（为了演示效果，实际项目中可去掉）
        while(itemsToShow.length < 20 && itemsToShow.length < sourceData.length * 2) {
            let randomItem = sourceData[Math.floor(Math.random() * sourceData.length)];
            let randomPairId = totalPairs + Math.floor(Math.random() * 5);
            itemsToShow.push({
                id: `extra_${itemsToShow.length}`,
                text: randomItem.word,
                type: 'word',
                pairId: randomPairId
            });
            itemsToShow.push({
                id: `extra_${itemsToShow.length+1}`,
                text: randomItem.pinyin,
                type: 'pinyin',
                pairId: randomPairId
            });
            totalPairs++;
        }
        
        // 再次打乱顺序
        shuffleArray(itemsToShow);
        
        currentItems = itemsToShow;
        renderBoard();
        startTimer();
    }

    // 渲染游戏面板
    function renderBoard() {
        gameBoard.innerHTML = '';
        matchedPairs = 0;
        
        currentItems.forEach(item => {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = item.text;
            bubble.dataset.id = item.id;
            bubble.dataset.pairId = item.pairId;
            bubble.dataset.type = item.type;
            
            // 分配随机颜色（柔和的渐变）
            const colors = [
                ['#8ecae6', '#219ebc'], // 蓝
                ['#ffb703', '#fb8500'], // 橙
                ['#06d6a0', '#118ab2'], // 绿
                ['#ef476f', '#ffd166'], // 粉
                ['#9b5de5', '#f15bb5'], // 紫
                ['#00bbf9', '#00f5d4'], // 青
                ['#fee440', '#9b5de5']  // 黄紫
            ];
            const colorSet = colors[Math.floor(Math.random() * colors.length)];
            bubble.style.setProperty('--color1', colorSet[0]);
            bubble.style.setProperty('--color2', colorSet[1]);
            
            bubble.addEventListener('click', handleBubbleClick);
            gameBoard.appendChild(bubble);
        });
    }

    // 处理泡泡点击
    function handleBubbleClick(e) {
        if (!soundEnabled) {
            unlockOverlay.style.display = 'flex';
            return;
        }

        const clicked = e.target;
        if (clicked.classList.contains('matched')) return;
        
        if (!selectedItem) {
            // 第一次点击
            selectedItem = clicked;
            clicked.style.border = "3px solid white";
        } else {
            // 第二次点击
            if (selectedItem === clicked) {
                // 取消选中
                selectedItem.style.border = "none";
                selectedItem = null;
                return;
            }
            
            // 判断是否匹配
            const isMatch = selectedItem.dataset.pairId === clicked.dataset.pairId && 
                           selectedItem.dataset.type !== clicked.dataset.type;
            
            if (isMatch) {
                // 匹配成功
                selectedItem.classList.add('matched');
                clicked.classList.add('matched');
                
                // 朗读
                speakText(clicked.textContent);
                
                matchedPairs++;
                setTimeout(() => {
                    selectedItem = null;
                    // 检查是否全部完成
                    if (matchedPairs >= totalPairs) {
                        stopTimer();
                        hintEl.textContent = "🎉 恭喜通关！点击继续挑战下一局";
                        speakText("恭喜通关");
                    }
                }, 300);
            } else {
                // 不匹配
                setTimeout(() => {
                    selectedItem.style.border = "none";
                    clicked.style.border = "none";
                    selectedItem = null;
                }, 300);
            }
        }
    }

    // 朗读函数
    function speakText(text) {
        if (!soundEnabled) return;
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            speechSynthesis.speak(utterance);
        }
    }

    // 重置游戏状态
    function resetGameState() {
        selectedItem = null;
        matchedPairs = 0;
        gameBoard.innerHTML = '';
        hintEl.textContent = "点匹配的泡泡 · 成功立刻朗读 🔊";
    }

    // 计时器
    function startTimer() {
        startTime = Date.now();
        timerInterval = setInterval(() => {
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            timerEl.textContent = elapsed + " 秒";
        }, 100);
    }

    function stopTimer() {
        clearInterval(timerInterval);
    }

    // 工具函数：打乱数组
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // 声音解锁
    function tryUnlockSound() {
        // 尝试播放静音，然后允许后续播放
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') {
            unlockOverlay.style.display = 'flex';
        } else {
            soundEnabled = true;
            unlockOverlay.style.display = 'none';
        }
    }

    function unlockSound() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') {
            ctx.resume().then(() => {
                soundEnabled = true;
                unlockOverlay.style.display = 'none';
                speakText("声音已开启");
            });
        } else {
            soundEnabled = true;
            unlockOverlay.style.display = 'none';
        }
    }
</script>
</body>
</html>
