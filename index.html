<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>生词消消乐 · 人教版四上全册</title>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.0/dist/index.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
html,body{height:100%}
body{background:#d9f2d0;display:flex;justify-content:center;padding:10px;overflow:hidden}
.wrap{width:100%;max-width:1100px;height:100%;background:rgba(235,250,220,.6);border:2px solid #b6d7a8;border-radius:28px;padding:14px 18px;display:flex;flex-direction:column;box-shadow:0 12px 30px rgba(80,110,70,.25);overflow:auto}
h1{font-size:clamp(28px,5vw,46px);color:#2d5e2c;text-align:center;text-shadow:3px 3px 0 #c0e0b0;font-weight:800;margin-bottom:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:#e5f4db;border:2px solid #9dc98d;border-radius:40px;padding:8px 14px;margin-bottom:8px}
select,button{font-size:16px;min-height:42px;border-radius:30px;border:2px solid #a5d69a;cursor:pointer}
select{background:#3d7a37;color:#fff;padding:6px 12px}
.btn{background:#3d7a37;color:#fff;padding:8px 18px;box-shadow:0 4px 0 #1d461b}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d461b}
.status{background:#f0fae8;border:1px solid #7baa6a;border-radius:30px;padding:6px 12px;font-weight:600;color:#1e4a1a}
.timer{display:flex;justify-content:space-between;background:#e5f4db;border:2px solid #9dc98d;border-radius:40px;padding:8px 18px;margin-bottom:8px;font-weight:700;color:#1e4a1a}
#timer{background:#2c5e2a;color:#f9ffe9;padding:4px 14px;border-radius:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px;flex:1;align-content:start;padding:10px}
.bubble{aspect-ratio:1/1;max-width:110px;width:100%;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;text-shadow:2px 2px 6px rgba(0,0,0,.5);font-size:clamp(14px,2.2vw,22px);cursor:pointer;box-shadow:0 12px 15px rgba(0,0,0,.25),inset 0 -8px 12px rgba(0,0,0,.2),inset 0 8px 12px rgba(255,255,255,.6);border:2px solid rgba(255,255,255,.35);word-break:break-word;padding:4px;text-align:center;transition:.15s}
.bubble:active{transform:scale(.95)}
.bubble.sel{filter:brightness(1.15) saturate(1.2);box-shadow:0 0 0 6px #ffe484,0 12px 20px rgba(0,0,0,.3)}
.bubble.gone{visibility:hidden;opacity:0;transform:scale(.2)}
.ok{background:#eaffe0;border:3px dashed #6f9e5c;border-radius:24px;padding:12px;text-align:center;font-weight:800;color:#1e5e1e;display:none;margin:8px 0}
.ok.show{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}
.box{background:#f0fae8;border-radius:18px;padding:18px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
textarea{width:100%;height:120px;border:2px solid #9dc98d;border-radius:10px;padding:10px;font-size:16px;resize:vertical}
.preview{background:#e8f5e1;border-radius:10px;padding:8px;margin:8px 0;white-space:pre-wrap;font-size:14px;color:#1e4a1a;max-height:120px;overflow:auto}
.hint{font-size:13px;color:#1e4a1a;line-height:1.5}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.mbtn{border:none;padding:10px 20px;border-radius:30px;color:#fff;font-weight:700;min-height:44px}
.mcancel{background:#aaa}.mok{background:#3d7a37}
@media (max-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:601px) and (max-width:1024px){.grid{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>✨ 生词消消乐 · 全册 ✨</h1>

  <div class="bar">
    <label>📚 人教版四上：</label>
    <select id="unit"></select>
    <button class="btn" id="apply">✅ 应用</button>
    <button class="btn" id="custom">📝 自定义词库</button>
    <span class="status" id="status">第一单元</span>
  </div>

  <div class="timer"><span>⏱️ 用时</span><span id="timer">0.0 秒</span></div>

  <div class="grid" id="grid"></div>

  <div class="ok" id="ok">🎉 恭喜挑战成功！用时 <span id="ft">0</span> 秒</div>

  <div class="bar" style="margin-top:8px">
    <button class="btn" id="next">🔁 继续挑战</button>
  </div>
  <div style="text-align:center;color:#3f653a;font-size:13px">点匹配的泡泡 · 成功立刻朗读 🔊</div>
</div>

<script>
/* ================= 人教版四上全册词库 ================= */
const BOOK = {

};

/* ================= 拼音转换（带声调） ================= */
function getPinyin(text) {
    try {
        // 使用 pinyin-pro 库，输出带声调拼音（如 chāo）
        return window.pinyinPro.pinyin(text, { toneType: 'symbol', type: 'array' }).join(' ');
    } catch(e) {
        // 兜底：手动映射（常用字）
        const map = {
            '潮':'cháo','观':'guān','据':'jù','堤':'dī','阔':'kuò','笼':'lóng','罩':'zhào','盼':'pàn',
            '滚':'gǔn','逐':'zhú','渐':'jiàn','犹':'yóu','淘':'táo','牵':'qiān','鹅':'é','卵':'luǎn',
            '坑':'kēng','洼':'wā','填':'tián','庄':'zhuāng','稼':'jià','俗':'sú','跃':'yuè','葡':'pú',
            '萄':'táo','稻':'dào','熟':'shú','巢':'cháo','苇':'wěi','罗':'luó','眠':'mián','霸':'bà',
            '占':'zhàn','豌':'wān','按':'àn','僵':'jiāng','预':'yù','揭':'jiē','啪':'pā','苔':'tái',
            '囚':'qiú','框':'kuàng','溢':'yì','舒':'shū','适':'shì','恐':'kǒng','硬':'yìng','枪':'qiāng',
            '耐':'nài','探':'tàn','愉':'yú','曾':'céng','蝙':'biān','蝠':'fú','启':'qǐ','即':'jí',
            '锐':'ruì','系':'xì','铛':'dāng','蝇':'yíng','证':'zhèng','障':'zhàng','荧':'yíng','屏':'píng',
            '达':'dá','蚊':'wén','科':'kē','横':'héng','竖':'shù','绳':'shéng','研':'yán','究':'jiū',
            '驾':'jià','驶':'shǐ','唤':'huàn','技':'jì','获':'huò','赖':'lài','潜':'qián','亿':'yì',
            '索':'suǒ','奥':'ào','舶':'bó','质':'zhì','哲':'zhé','兰':'lán','纪':'jì','改':'gǎi',
            '程':'chéng','超':'chāo','益':'yì','联':'lián','任':'rèn','善':'shàn','暮':'mù','瑟':'sè',
            '缘':'yuán','降':'xiáng','骚':'sāo','逊':'xùn','输':'shū','吟':'yín','题':'tí','侧':'cè',
            '峰':'fēng','庐':'lú','阁':'gé','费':'fèi','须':'xū','虎':'hǔ','操':'cāo','嫩':'nèn',
            '顺':'shùn','均':'jūn','叠':'dié','隙':'xì','茎':'jīng','柄':'bǐng','萎':'wěi','瞧':'qiáo',
            '固':'gù','蜗':'wō','曲':'qū','宅':'zhái','隐':'yǐn','毫':'háo','慎':'shèn','址':'zhǐ',
            '良':'liáng','掘':'jué','搜':'sōu','倾':'qīng','骤':'zhòu','置':'zhì','抛':'pāo','劈':'pī',
            '浊':'zhuó','丈':'zhàng','隆':'lóng','肢':'zhī','躯':'qū','液':'yè','缓':'huǎn','撑':'chēng',
            '竭':'jié','累':'lèi','血':'xuè','茂':'mào','滋':'zī','宗':'zōng','帝':'dì','少':'shào',
            '曰':'yuē','溺':'nì','返':'fǎn','堙':'yīn','斯':'sī','惨':'cǎn','盗':'dào','败':'bài',
            '惩':'chéng','佩':'pèi','恕':'shù','锁':'suǒ','遭':'zāo','恶':'è','愤':'fèn','悲':'bēi',
            '兽':'shòu','坚':'jiān','违':'wéi','抗':'kàng','环':'huán','既':'jì','狠':'hěn','著':'zhù',
            '嗅':'xiù','奈':'nài','拯':'zhěng','幼':'yòu','嘶':'sī','哑':'yǎ','庞':'páng','愣':'lèng',
            '备':'bèi','凌':'líng','搏':'bó','摇':'yáo','撼':'hàn','谓':'wèi','拳':'quán','捶':'chuí',
            '顽':'wán','脱':'tuō','惹':'rě','昏':'hūn','握':'wò','摔':'shuāi','凭':'píng','掐':'qiā',

}

/* ================= 语音朗读（修复浏览器无声音） ================= */
let voicesLoaded = false;
let voiceReady = false;

function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    const voices = speechSynthesis.getVoices();
    if (voices.length > 0) voicesLoaded = true;
}

// 部分浏览器需要用户交互才能解锁语音
function unlockAudio() {
    if (!('speechSynthesis' in window)) return;
    // 播放一段静音来解锁
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
    voiceReady = true;
}

// 页面加载时尝试加载语音列表
if ('speechSynthesis' in window) {
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
}

// 首次点击页面任意位置解锁语音
document.addEventListener('click', function unlockOnce() {
    unlockAudio();
    document.removeEventListener('click', unlockOnce);
}, { once: true });

function say(t) {
    if (!('speechSynthesis' in window)) return;
    // 确保语音已解锁
    if (!voiceReady) unlockAudio();
    
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    
    // 选择中文语音
    let voices = speechSynthesis.getVoices();
    let v = voices.find(x => /zh|Chinese|中文/i.test(x.lang + x.name));
    if (v) u.voice = v;
    
    u.lang = 'zh-CN';
    u.rate = 0.85;
    u.pitch = 1.1;
    u.volume = 1.0;
    
    speechSynthesis.speak(u);
}

/* ================= 状态 ================= */
let list=[];      // {text, py, kind:'char'|'word'}
let items=[];     // 泡泡
let sel=null, timer=null, t0=0, finished=false;

const $=id=>document.getElementById(id);
const grid=$('grid');

/* 教材下拉 */
function fillUnits(){
  $('unit').innerHTML='';
  for(const k in BOOK){
    const o=document.createElement('option'); o.value=k; o.textContent=BOOK[k].name; $('unit').appendChild(o);
  }
}

function useUnit(k){
  const u=BOOK[k];
  list=[];
  u.chars.forEach(c=>{
    const py = getPinyin(c);
    if(py) list.push({text:c, py, kind:'char'});
  });
  u.words.forEach(w=>{
    const py = getPinyin(w);
    if(py) list.push({text:w, py, kind:'word'});
  });
  $('status').textContent='人教版四上 · '+u.name;
  newGame();
}

/* 手动输入 */
$('custom').onclick=()=>{
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box">
    <h3>📝 自定义词库</h3>
    <p class="hint">每行一个，支持汉字、词语：<br>潮<br>观潮<br>爬山虎</p>
    <textarea id="ta" placeholder="潮\n观潮\n爬山虎"></textarea>
    <div class="preview" id="pv">输入后点击"转换"查看拼音</div>
    <div class="row">
      <button class="mbtn mcancel" id="x">取消</button>
      <button class="mbtn mok" id="convert">🔄 转换</button>
      <button class="mbtn mok" id="ok2">✅ 用这个词库</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  const ta=m.querySelector('#ta'), pv=m.querySelector('#pv');
  let convertedList=[];

  m.querySelector('#convert').onclick=()=>{
    const lines=ta.value.split(/\n/).map(s=>s.trim()).filter(Boolean);
    if(!lines.length){alert('请输入内容');return;}
    convertedList=[];
    let output='';
    lines.forEach(line=>{
      const py = getPinyin(line);
      if(py){
        convertedList.push({text:line, py, kind:line.length>1?'word':'char'});
        output += `${line} → ${py}\n`;
      }else{
        output += `❌ ${line} 无法识别\n`;
      }
    });
    pv.textContent=output;
  };

  m.querySelector('#x').onclick=()=>m.remove();
  m.querySelector('#ok2').onclick=()=>{
    if(!convertedList.length){
      alert('请先点击"转换"生成拼音');
      return;
    }
    list=convertedList;
    $('status').textContent=`自定义词库（${list.length}条）`;
    m.remove(); newGame();
  };
};

/* 生成配对 */
function newGame(){
  if(!list.length)return;
  const pool=[...list].sort(()=>Math.random()-.5).slice(0,9);
  items=[];
  pool.forEach((it,i)=>{
    items.push({key:i,text:it.text,py:it.py,side:'text',matched:false});
    items.push({key:i,text:it.text,py:it.py,side:'py',matched:false});
  });
  items.sort(()=>Math.random()-.5);
  sel=null; finished=false; $('ok').classList.remove('show');
  render(); startTimer();
}

function render(){
  grid.innerHTML='';
  items.forEach((it,i)=>{
    const b=document.createElement('div');
    b.className='bubble'+(it.matched?' gone':'')+(sel===i?' sel':'');
    b.style.background=`radial-gradient(circle at 30% 25%, #fff9, hsl(${Math.random()*360} 65% 62%) 60%, #0003)`;
    b.textContent=it.side==='text'?it.text:it.py;
    b.onclick=()=>click(i);
    grid.appendChild(b);
  });
}

function click(i){
  if(finished||items[i].matched)return;
  if(sel===null){sel=i;render();return;}
  if(sel===i){sel=null;render();return;}
  const a=items[sel], b=items[i];
  if(a.key===b.key && a.side!==b.side){
    a.matched=b.matched=true;
    say(a.text);            // ★ 配对成功立刻读
    sel=null; render();
    if(items.every(x=>x.matched))win();
  }else{
    sel=null; render();
  }
}

function win(){
  finished=true; stopTimer();
  $('ft').textContent=((performance.now()-t0)/1000).toFixed(1);
  $('ok').classList.add('show');
  say('恭喜挑战成功');
}

function startTimer(){stopTimer();t0=performance.now();
  timer=setInterval(()=>{$('timer').textContent=((performance.now()-t0)/1000).toFixed(1)+' 秒';},100);}
function stopTimer(){clearInterval(timer);}

/* 事件 */
$('apply').onclick=()=>useUnit($('unit').value);
$('next').onclick=newGame;

fillUnits(); useUnit('u1');
if('speechSynthesis'in window) speechSynthesis.getVoices();
</script>
</body>
</html>
