<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>生词消消乐 · 人教版四年级同步</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #d9f2d0;
            touch-action: manipulation;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
            overscroll-behavior: none;
        }
        .game-wrapper {
            width: 100%;
            max-width: 1200px;
            height: 100%;
            max-height: 100vh;
            background: rgba(235, 250, 220, 0.55);
            backdrop-filter: blur(2px);
            border-radius: 30px;
            padding: 15px 20px;
            box-shadow: 0 12px 30px rgba(80, 110, 70, 0.25);
            border: 2px solid #b6d7a8;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            letter-spacing: 4px;
            text-align: center;
            color: #2d5e2c;
            text-shadow: 3px 3px 0 #c0e0b0, 5px 5px 0 rgba(0,0,0,0.1);
            margin: 0 0 10px 0;
            font-weight: 800;
            flex-shrink: 0;
        }
        
        .book-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: #e5f4db;
            padding: 10px 15px;
            border-radius: 40px;
            margin-bottom: 10px;
            border: 2px solid #9dc98d;
            flex-shrink: 0;
        }
        .book-selector select {
            background: #3d7a37;
            color: white;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 30px;
            border: 2px solid #a5d69a;
            cursor: pointer;
            min-height: 40px;
            max-width: 160px;
        }
        .book-selector select option {
            background: #f0fae8;
            color: #1e4a1a;
        }
        .book-selector label {
            color: #1e4a1a;
            font-weight: 600;
            font-size: clamp(0.8rem, 1.8vw, 1rem);
        }
        
        .upload-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: #e5f4db;
            padding: 10px 15px;
            border-radius: 40px;
            margin-bottom: 10px;
            border: 2px solid #9dc98d;
            flex-shrink: 0;
        }
        .upload-btn {
            background: #3d7a37;
            color: white;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1d461b;
            transition: 0.1s;
            border: 2px solid #a5d69a;
            display: inline-block;
            min-height: 40px;
        }
        .upload-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1d461b;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-status {
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #1e4a1a;
            font-weight: 600;
            background: #f0fae8;
            padding: 8px 12px;
            border-radius: 30px;
            border: 1px solid #7baa6a;
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .timer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: 600;
            color: #1e4a1a;
            background: #e5f4db;
            padding: 10px 20px;
            border-radius: 40px;
            border: 2px solid #9dc98d;
            flex-shrink: 0;
        }
        #timer {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 700;
            background: #2c5e2a;
            color: #f9ffe9;
            padding: 5px 15px;
            border-radius: 40px;
            letter-spacing: 1px;
        }
        
        .bubble-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: clamp(10px, 2vw, 20px);
            justify-content: center;
            align-items: center;
            margin: 5px 0 15px;
            padding: 5px;
            flex: 1;
            min-height: 0;
        }
        .bubble {
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: 120px;
            margin: 0 auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
            background: radial-gradient(circle at 30% 25%, #fff9, #ffffff10 45%, #00000030);
            box-shadow: 0 12px 15px rgba(0,0,0,0.25), inset 0 -8px 12px rgba(0,0,0,0.2), inset 0 8px 12px rgba(255,255,255,0.6);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.2s;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.35);
            background-blend-mode: overlay;
            line-height: 1;
            word-break: break-word;
            padding: 0 5px;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .bubble:active {
            transform: scale(0.95);
            filter: brightness(0.95);
        }
        .bubble.selected {
            filter: brightness(1.15) saturate(1.2);
            box-shadow: 0 0 0 6px #ffe484, 0 12px 20px rgba(0,0,0,0.3), inset 0 -6px 10px rgba(0,0,0,0.2);
            transform: scale(1.02);
        }
        .bubble.matched-hidden {
            visibility: hidden;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.2);
            transition: visibility 0.2s, opacity 0.2s, transform 0.25s;
        }
        .bubble span {
            display: block;
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 900;
            text-shadow: 2px 2px 0 #00000055;
            transform: rotate(-2deg);
            pointer-events: none;
        }
        
        .control-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
            flex-shrink: 0;
        }
        .btn {
            background: #3d7a37;
            color: white;
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            box-shadow: 0 8px 0 #1d461b, 0 10px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: 0.1s linear;
            letter-spacing: 2px;
            border: 2px solid #a5d69a;
            min-height: 50px;
            min-width: 120px;
        }
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #1d461b, 0 6px 10px rgba(0,0,0,0.2);
        }
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(3px);
            box-shadow: 0 4px 0 #1d461b;
            pointer-events: none;
        }
        
        .message-success {
            background: #eaffe0;
            border-radius: 30px;
            padding: 15px 20px;
            margin: 10px 0;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 800;
            color: #1e5e1e;
            text-align: center;
            border: 3px dashed #6f9e5c;
            box-shadow: 0 5px 0 #b8d9a8;
            flex-shrink: 0;
        }
        #successMessage {
            display: none;
        }
        #successMessage.show {
            display: block;
        }
        .footer-note {
            margin-top: 5px;
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            color: #3f653a;
            text-align: center;
            flex-shrink: 0;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-box {
            background: #f0fae8;
            padding: 20px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .modal-box h3 {
            color: #2d5e2c;
            margin-bottom: 10px;
        }
        .modal-box img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-bottom: 15px;
            object-fit: contain;
            background: #fff;
        }
        .modal-box textarea {
            width: 100%;
            border-radius: 10px;
            border: 2px solid #9dc98d;
            padding: 10px;
            font-size: 1rem;
            min-height: 120px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: flex-end;
        }
        .modal-btn {
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            min-height: 44px;
            cursor: pointer;
        }
        .modal-btn.cancel {
            background: #aaa;
        }
        .modal-btn.confirm {
            background: #3d7a37;
        }
        .modal-btn:active {
            transform: translateY(2px);
        }
        
        @media (orientation: landscape) and (max-height: 600px) {
            .game-wrapper { padding: 10px 15px; }
            .bubble-grid { gap: 8px; }
            .bubble { font-size: 1.2rem; }
            .bubble span { font-size: 1.2rem; }
        }
        @supports (padding: env(safe-area-inset-bottom)) {
            body {
                padding-bottom: env(safe-area-inset-bottom);
                padding-top: env(safe-area-inset-top);
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
        }
        .game-wrapper::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .game-wrapper::-webkit-scrollbar-thumb {
            background: #7baa6a;
            border-radius: 10px;
        }
        .game-wrapper::-webkit-scrollbar-track {
            background: #e5f4db;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <h1>✨ 生词消消乐 ✨</h1>
    
    <div class="book-selector">
        <label>📚 人教版四年级：</label>
        <select id="unitSelect">
            <!-- 动态填充 -->
        </select>
        <button id="applyBookBtn" class="upload-btn" style="background:#2c5e2a;">✅ 应用</button>
    </div>
    
    <div class="upload-area">
        <label for="imageUpload" class="upload-btn">📷 拍照/自定义词库</label>
        <input type="file" id="imageUpload" accept="image/*" capture="environment">
        <span class="upload-status" id="uploadStatus">人教版四年级同步</span>
    </div>

    <div class="timer-bar">
        <span>⏱️ 用时</span>
        <span id="timer">0.0 秒</span>
    </div>

    <div id="bubbleGrid" class="bubble-grid"></div>

    <div id="successMessage" class="message-success">
        🎉 恭喜挑战成功！ 🎉<br> 用时 <span id="finalTime">0.0</span> 秒
    </div>

    <div class="control-area">
        <button id="continueBtn" class="btn">🔁 继续挑战</button>
    </div>
    <div class="footer-note">点击两个泡泡配对 · 配对成功自动读汉字 🔊</div>
</div>

                { char: '俗', pinyin: 'sú' }, { char: '跃', pinyin: 'yuè' },
                { char: '穗', pinyin: 'suì' }, { char: '剪', pinyin: 'jiǎn' },
                { char: '烛', pinyin: 'zhú' }, { char: '廊', pinyin: 'láng' },
                // 第3课《现代诗二首》
                { char: '巢', pinyin: 'cháo' }, { char: '苇', pinyin: 'wěi' },
                { char: '罗', pinyin: 'luó' }, { char: '眠', pinyin: 'mián' },
                { char: '霸', pinyin: 'bà' }, { char: '占', pinyin: 'zhàn' }
            ]},
            unit2: { name: '第二单元', words: [
                // 第5课《一个豆荚里的五粒豆》
                { char: '豌', pinyin: 'wān' }, { char: '按', pinyin: 'àn' },
                { char: '僵', pinyin: 'jiāng' }, { char: '苔', pinyin: 'tái' },
                { char: '囚', pinyin: 'qiú' }, { char: '框', pinyin: 'kuàng' },
                { char: '硬', pinyin: 'yìng' }, { char: '曾', pinyin: 'céng' },
                // 第6课《蝙蝠和雷达》
                { char: '蝙', pinyin: 'biān' }, { char: '蝠', pinyin: 'fú' },
                { char: '启', pinyin: 'qǐ' }, { char: '即', pinyin: 'jí' },
                { char: '锐', pinyin: 'ruì' }, { char: '铛', pinyin: 'dāng' },
                { char: '蝇', pinyin: 'yíng' }, { char: '障', pinyin: 'zhàng' },
                { char: '荧', pinyin: 'yíng' }, { char: '屏', pinyin: 'píng' },
                // 第7课《呼风唤雨的世纪》
                { char: '唤', pinyin: 'huàn' }, { char: '技', pinyin: 'jì' },
                { char: '程', pinyin: 'chéng' }, { char: '超', pinyin: 'chāo' },
                { char: '亿', pinyin: 'yì' }, { char: '索', pinyin: 'suǒ' },
                { char: '奥', pinyin: 'ào' }, { char: '秘', pinyin: 'mì' },
                { char: '质', pinyin: 'zhì' }, { char: '哲', pinyin: 'zhé' }
            ]},
            unit3: { name: '第三单元', words: [
                // 第9课《古诗三首》
                { char: '暮', pinyin: 'mù' }, { char: '吟', pinyin: 'yín' },
                { char: '题', pinyin: 'tí' }, { char: '侧', pinyin: 'cè' },
                { char: '峰', pinyin: 'fēng' }, { char: '庐', pinyin: 'lú' },
                { char: '缘', pinyin: 'yuán' }, { char: '降', pinyin: 'xiáng' },
                { char: '阁', pinyin: 'gé' }, { char: '费', pinyin: 'fèi' },
                { char: '须', pinyin: 'xū' }, { char: '逊', pinyin: 'xùn' },
                { char: '输', pinyin: 'shū' },
                // 第10课《爬山虎的脚》
                { char: '虎', pinyin: 'hǔ' }, { char: '操', pinyin: 'cāo' },
                { char: '占', pinyin: 'zhàn' }, { char: '嫩', pinyin: 'nèn' },
                { char: '舒', pinyin: 'shū' }, { char: '顺', pinyin: 'shùn' },
                { char: '均', pinyin: 'jūn' }, { char: '叠', pinyin: 'dié' },
                { char: '隙', pinyin: 'xì' }, { char: '茎', pinyin: 'jīng' },
                { char: '柄', pinyin: 'bǐng' }, { char: '萎', pinyin: 'wěi' },
                { char: '瞧', pinyin: 'qiáo' }, { char: '固', pinyin: 'gù' }
            ]},
            unit4: { name: '第四单元', words: [
                // 第12课《盘古开天地》
                { char: '盘', pinyin: 'pán' }, { char: '古', pinyin: 'gǔ' },
                { char: '撑', pinyin: 'chēng' }, { char: '肌', pinyin: 'jī' },
                { char: '肤', pinyin: 'fū' }, { char: '辽', pinyin: 'liáo' },
                { char: '阔', pinyin: 'kuò' }, { char: '血', pinyin: 'xuè' },
                { char: '液', pinyin: 'yè' }, { char: '茂', pinyin: 'mào' },
                { char: '滋', pinyin: 'zī' }, { char: '润', pinyin: 'rùn' },
                { char: '创', pinyin: 'chuàng' }, { char: '造', pinyin: 'zào' },
                // 第13课《精卫填海》
                { char: '帝', pinyin: 'dì' }, { char: '曰', pinyin: 'yuē' },
                { char: '溺', pinyin: 'nì' }, { char: '返', pinyin: 'fǎn' },
                { char: '衔', pinyin: 'xián' }, { char: '堙', pinyin: 'yīn' },
                // 第14课《普罗米修斯》
                { char: '悲', pinyin: 'bēi' }, { char: '惨', pinyin: 'cǎn' },
                { char: '兽', pinyin: 'shòu' }, { char: '佩', pinyin: 'pèi' },
                { char: '坚', pinyin: 'jiān' }, { char: '定', pinyin: 'dìng' },
                { char: '违', pinyin: 'wéi' }, { char: '抗', pinyin: 'kàng' },
                { char: '环', pinyin: 'huán' }, { char: '锁', pinyin: 'suǒ' },
                { char: '既', pinyin: 'jì' }, { char: '狠', pinyin: 'hěn' },
                { char: '著', pinyin: 'zhù' }, { char: '愤', pinyin: 'fèn' },
                { char: '获', pinyin: 'huò' }
            ]}
        };

        // 当前使用的词库
        let activeWordList = [];
        let currentItems = [];
        let selectedIndex = null;
        let startTime = null;
        let timerInterval = null;
        let gameFinished = false;
        let totalSeconds = 0;

        const gridEl = document.getElementById('bubbleGrid');
        const timerEl = document.getElementById('timer');
        const successMsg = document.getElementById('successMessage');
        const finalTimeSpan = document.getElementById('finalTime');
        const continueBtn = document.getElementById('continueBtn');
        const imageUpload = document.getElementById('imageUpload');
        const uploadStatus = document.getElementById('uploadStatus');
        const unitSelect = document.getElementById('unitSelect');
        const applyBookBtn = document.getElementById('applyBookBtn');

        // ================= 教材选择逻辑 =================
        function updateUnitOptions() {
            unitSelect.innerHTML = '';
            Object.keys(GRADE4_WORDS).forEach(unitKey => {
                const option = document.createElement('option');
                option.value = unitKey;
                option.textContent = GRADE4_WORDS[unitKey].name;
                unitSelect.appendChild(option);
            });
            if (unitSelect.options.length > 0) {
                applyBookSelection();
            }
        }

        function applyBookSelection() {
            const unit = unitSelect.value;
            const selectedData = GRADE4_WORDS[unit];
            if (selectedData) {
                activeWordList = selectedData.words;
                uploadStatus.textContent = `人教版四年级 · ${selectedData.name}`;
                newGame();
            }
        }

        unitSelect.addEventListener('change', applyBookSelection);
        applyBookBtn.addEventListener('click', applyBookSelection);

        // ================= 发音 =================
        function speakCharacter(character) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(character);
            const voices = window.speechSynthesis.getVoices();
            const zhVoices = voices.filter(voice => 
                voice.lang.toLowerCase().includes('zh-cn') || voice.lang.toLowerCase().includes('zh_cn') || voice.lang.toLowerCase().includes('zh')
            );
            if (zhVoices.length > 0) {
                const preferred = zhVoices.find(voice => 
                    voice.name.includes('Huihui') || voice.name.includes('Xiaoxiao') || 
                    voice.name.includes('Yunxi') || voice.name.includes('Yunyang') || 
                    voice.name.includes('Microsoft') || voice.name.includes('Lili') ||
                    voice.name.includes('Tingting')
                );
                utterance.voice = preferred || zhVoices[0];
            }
            utterance.lang = 'zh-CN';
            utterance.rate = 0.85;
            utterance.pitch = 1.1;
            utterance.volume = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // ================= 工具函数 =================
        function formatTime(sec) {
            return sec.toFixed(1);
        }

        function randomBubbleColor() {
            const hue = Math.floor(Math.random() * 360);
            const sat = 55 + Math.floor(Math.random() * 30);
            const light = 55 + Math.floor(Math.random() * 20);
            return `hsl(${hue} ${sat}% ${light}%)`;
        }

        function generateRandomPairs() {
            const count = Math.min(activeWordList.length, 9);
            const shuffled = [...activeWordList].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, count);
            const bubbles = [];
            selected.forEach((item, idx) => {
                bubbles.push({
                    id: `c-${idx}-${item.char}`,
                    type: 'char',
                    char: item.char,
                    pinyin: item.pinyin,
                    matched: false,
                });
                bubbles.push({
                    id: `p-${idx}-${item.pinyin}`,
                    type: 'pinyin',
                    char: item.char,
                    pinyin: item.pinyin,
                    matched: false,
                });
            });
            for (let i = bubbles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [bubbles[i], bubbles[j]] = [bubbles[j], bubbles[i]];
            }
            return bubbles;
        }

        function renderGrid() {
            gridEl.innerHTML = '';
            currentItems.forEach((item, index) => {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                if (item.matched) {
                    bubble.classList.add('matched-hidden');
                }
                bubble.style.background = `radial-gradient(circle at 30% 25%, #ffffff90, ${randomBubbleColor()} 60%, #00000025)`;
                const content = document.createElement('span');
                content.textContent = item.type === 'char' ? item.char : item.pinyin;
                bubble.appendChild(content);
                bubble.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleBubbleClick(index);
                });
                if (selectedIndex === index && !item.matched) {
                    bubble.classList.add('selected');
                }
                gridEl.appendChild(bubble);
            });
        }

        function handleBubbleClick(index) {
            if (gameFinished) return;
            const item = currentItems[index];
            if (item.matched) return;

            if (selectedIndex !== null) {
                if (selectedIndex === index) {
                    clearSelected();
                    return;
                }
                const firstItem = currentItems[selectedIndex];
                const secondItem = item;
                const isMatch = (
                    (firstItem.type !== secondItem.type) &&
                    (firstItem.char === secondItem.char) &&
                    (firstItem.pinyin === secondItem.pinyin)
                );

                if (isMatch) {
                    speakCharacter(firstItem.char);
                    firstItem.matched = true;
                    secondItem.matched = true;
                    clearSelected(false);
                    renderGrid();
                    checkAllMatched();
                } else {
                    clearSelected(true);
                }
            } else {
                selectedIndex = index;
                renderGrid();
            }
        }

        function clearSelected(render = true) {
            selectedIndex = null;
            if (render) renderGrid();
        }

        function checkAllMatched() {
            const allMatched = currentItems.every(item => item.matched);
            if (allMatched) {
                gameFinished = true;
                stopTimer();
                successMsg.classList.add('show');
                finalTimeSpan.textContent = formatTime(totalSeconds);
            }
        }

        function startTimer() {
            stopTimer();
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                totalSeconds = elapsed;
                timerEl.textContent = formatTime(elapsed) + ' 秒';
            }, 100);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function newGame() {
            if (activeWordList.length === 0) {
                alert('当前词库为空，请选择教材或上传词库');
                return;
            }
            currentItems = generateRandomPairs();
            selectedIndex = null;
            gameFinished = false;
            successMsg.classList.remove('show');
            stopTimer();
            totalSeconds = 0;
            timerEl.textContent = '0.0 秒';
            renderGrid();
            startTimer();
        }

        function continueChallenge() {
            newGame();
        }

        // ================= 图片上传（自定义词库） =================
        function handleImageUpload(file) {
            if (!file) {
                alert('未获取到图片文件，请重试');
                return;
            }
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件（jpg/png等）');
                return;
            }

            const reader = new FileReader();
            reader.onerror = () => {
                alert('图片读取失败，请重试');
            };
            reader.onload = (e) => {
                const imgDataUrl = e.target.result;
                const oldModal = document.querySelector('.modal-overlay');
                if (oldModal) oldModal.remove();
                
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.innerHTML = `
                    <div class="modal-box">
                        <h3>📖 自定义词库</h3>
                        <img src="${imgDataUrl}" alt="生词表图片" onerror="this.style.display='none'">
                        <p style="font-size:0.9rem; color:#1e4a1a; margin:10px 0;">
                            ⚠️ 浏览器无法自动识别图片文字，请对照图片手动输入或粘贴生词<br>
                            <strong>每行格式：汉字,拼音</strong>（支持逗号/空格/制表符）
                        </p>
                        <textarea id="ocrTextArea" placeholder="例：&#10;潮, cháo&#10;盐, yán&#10;笼, lóng"></textarea>
                        <div class="modal-actions">
                            <button class="modal-btn cancel" id="cancelOcr">取消</button>
                            <button class="modal-btn confirm" id="confirmOcr">使用此词库</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);

                modal.querySelector('#cancelOcr').addEventListener('click', () => {
                    modal.remove();
                });

                modal.querySelector('#confirmOcr').addEventListener('click', () => {
                    const textArea = modal.querySelector('#ocrTextArea');
                    const text = textArea.value.trim();
                    if (!text) {
                        alert('请输入生词内容');
                        return;
                    }
                    const parsed = parseTextToWords(text);
                    if (parsed.length === 0) {
                        alert('未解析到有效生字，请检查格式（每行：汉字,拼音）');
                        return;
                    }
                    activeWordList = parsed;
                    uploadStatus.textContent = `自定义词库 (${parsed.length}字)`;
                    modal.remove();
                    newGame();
                });
            };
            reader.readAsDataURL(file);
        }

        function parseTextToWords(text) {
            const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
            const parsedWords = [];
            const seenChars = new Set();
            
            lines.forEach(line => {
                const normalized = line.replace(/[，、;；]+/g, ',').replace(/\s+/g, ' ');
                let parts = normalized.split(/[,]+/).map(s => s.trim());
                
                if (parts.length >= 2) {
                    let charPart = parts[0];
                    let pinyinPart = parts.slice(1).join(' ');
                    
                    if (/^[a-zA-Z]/.test(charPart) && !/^[a-zA-Z]/.test(pinyinPart)) {
                        [charPart, pinyinPart] = [pinyinPart, charPart];
                    }
                    
                    const charMatch = charPart.match(/[\u4e00-\u9fa5]/);
                    if (!charMatch) return;
                    
                    const char = charMatch[0];
                    const pinyinMatch = pinyinPart.match(/[a-zA-Z]+/);
                    if (!pinyinMatch) return;
                    
                    const pinyin = pinyinMatch[0].toLowerCase();
                    
                    if (char && pinyin && !seenChars.has(char)) {
                        seenChars.add(char);
                        parsedWords.push({ char, pinyin });
                    }
                } else {
                    const spaceParts = normalized.split(' ').filter(s => s.trim() !== '');
                    if (spaceParts.length >= 2) {
                        let charPart = spaceParts[0];
                        let pinyinPart = spaceParts.slice(1).join(' ');
                        
                        if (/^[a-zA-Z]/.test(charPart) && !/^[a-zA-Z]/.test(pinyinPart)) {
                            [charPart, pinyinPart] = [pinyinPart, charPart];
                        }
                        
                        const charMatch = charPart.match(/[\u4e00-\u9fa5]/);
                        if (!charMatch) return;
                        
                        const char = charMatch[0];
                        const pinyinMatch = pinyinPart.match(/[a-zA-Z]+/);
                        if (!pinyinMatch) return;
                        
                        const pinyin = pinyinMatch[0].toLowerCase();
                        
                        if (char && pinyin && !seenChars.has(char)) {
                            seenChars.add(char);
                            parsedWords.push({ char, pinyin });
                        }
                    }
                }
            });
            
            return parsedWords;
        }

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleImageUpload(file);
                imageUpload.value = '';
            }
        });

        continueBtn.addEventListener('click', continueChallenge);

        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // 初始化
        updateUnitOptions();
    })();
</script>
</body>
</html>
