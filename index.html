<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>语文生词消消乐</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #e8f5e9;
    font-family: 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
}
.header {
    width: 100%;
    max-width: 600px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
}
.header h1 { font-size: 20px; color: #2e7d32; }
.header select {
    padding: 6px 12px;
    font-size: 14px;
    border: 1px solid #4caf50;
    border-radius: 8px;
    background: #fff;
}
.header button {
    padding: 6px 12px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    background: #4caf50;
    color: #fff;
    cursor: pointer;
}
.header button:active { background: #388e3c; }
.timer {
    font-size: 16px;
    color: #333;
    font-weight: bold;
}
.grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 600px;
    padding: 10px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.card {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    background: #e3f2fd;
    border: 2px solid #90caf9;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
    padding: 5px;
    word-break: break-all;
}
.card.selected {
    background: #ffeb3b;
    border-color: #fbc02d;
    transform: scale(1.05);
}
.card.matched {
    background: #c8e6c9;
    border-color: #66bb6a;
    color: #2e7d32;
    pointer-events: none;
}
.card.wrong {
    background: #ffcdd2;
    border-color: #ef5350;
    animation: shake 0.3s;
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}
.success-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}
.success-box {
    background: #fff;
    padding: 30px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.success-box h2 { color: #4caf50; font-size: 28px; margin-bottom: 10px; }
.success-box p { font-size: 18px; color: #666; margin-bottom: 20px; }
.success-box button {
    padding: 12px 30px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #4caf50;
    color: #fff;
    cursor: pointer;
}
.success-box button:active { background: #388e3c; }
.custom-dialog {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}
.custom-box {
    background: #fff;
    padding: 20px;
    border-radius: 16px;
    width: 90%;
    max-width: 500px;
}
.custom-box h3 { margin-bottom: 10px; color: #333; }
.custom-box textarea {
    width: 100%;
    height: 150px;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 10px;
    resize: vertical;
}
.custom-box .btn-group {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}
.custom-box button {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
}
.btn-save { background: #4caf50; color: #fff; }
.btn-cancel { background: #ccc; color: #333; }
</style>
</head>
<body>

<div class="header">
    <h1>📚 生词消消乐</h1>
    <select id="unitSelect">
        <option value="1">第一单元</option>
        <option value="2">第二单元</option>
        <option value="3">第三单元</option>
        <option value="4">第四单元</option>
        <option value="5">第五单元</option>
        <option value="6">第六单元</option>
        <option value="7">第七单元</option>
        <option value="8">第八单元</option>
        <option value="custom">自定义词库</option>
    </select>
    <button onclick="openCustomDialog()">📝 自定义</button>
    <button onclick="toggleSound()">🔊 声音</button>
    <span class="timer" id="timer">0秒</span>
</div>

<div class="grid" id="grid"></div>

<div class="success-overlay" id="successOverlay" style="display:none;">
    <div class="success-box">
        <h2>🎉 恭喜挑战成功！</h2>
        <p>用时：<span id="finalTime">0</span></p>
        <button onclick="startGame()">继续挑战</button>
    </div>
</div>

<div class="custom-dialog" id="customDialog">
    <div class="custom-box">
        <h3>自定义词库</h3>
        <p style="font-size:12px;color:#999;margin-bottom:10px;">每行一个词，格式：词语 拼音（可选）</p>
        <textarea id="customWords" placeholder="例如：&#10;苹果 píngguǒ&#10;香蕉 xiāngjiāo&#10;西瓜 xīguā"></textarea>
        <div class="btn-group">
            <button class="btn-cancel" onclick="closeCustomDialog()">取消</button>
            <button class="btn-save" onclick="saveCustomWords()">保存</button>
        </div>
    </div>
</div>

<script>
// ===== 词库数据 =====
const wordBank = {
    1: ['观潮','奇观','农历','据说','宽阔','人山人海','顿时','逐渐','犹如','齐头并进','山崩地裂','霎时','余波','依旧','走月亮','柔和','鹅卵石','河床','新鲜','修补','坑坑洼洼','庄稼','风俗','葡萄','满意','水稻','成熟','招待','传说'],
    2: ['豌豆','按照','暖洋洋','舒适','黑暗','恐怕','僵硬','丰满','等待','虚弱','耐心','愉快','兴奋','曾经','蝙蝠','雷达','蚊子','灵巧','横七竖八','绳子','苍蝇','研究','证明','驾驶员','呼风唤雨','世纪','技术','改变','程度','超过','腾云驾雾','幻想','奥秘','日益','联系','物质','哲学','任何','创造','不断'],
    3: ['暮江吟','题西林壁','庐山','侧面','山峰','缘分','投降','逊色','输入','爬山虎','嫩红','舒服','均匀','重叠','空隙','叶柄','反面','触角','弯曲','痕迹','牢固','休想','住宅','随遇而安','住址','优良','专家','修理','清洁'],
    4: ['盘古','精疲力竭','血液','茂盛','雨露','祖宗','精卫填海','普罗米修斯','悲惨','情景','危害','严厉','敬佩','归还','坚定','违抗','尖利','愤愤不平','获得'],
    5: ['嗅到','无可奈何','巢穴','身躯','拯救','幼小','嘶哑','庞大','愣住','准备','凌空','搏斗','摇撼'],
    6: ['无所谓','拳头','捶背','顽皮','脱掉','惹怒','昏倒','握住','摔倒','凭借','掐住','恐怖','斑点','骆驼','羡慕'],
    7: ['出塞','秦朝','征战','歌词','催促','陶醉','杰出','亦然','英雄','项羽'],
    8: ['豹子','娶亲','媳妇','淹没','逼迫','干旱','跪下','绸缎','徒弟','流淌','巫师','绅士','吊灯','倒塌','开凿','渠道','灌溉']
};

// 自定义词库
let customWords = [];
let currentUnit = '1';

// ===== 游戏状态 =====
let cards = [];
let selectedCard = null;
let matchedCount = 0;
let totalPairs = 9;
let startTime = 0;
let timerInterval = null;
let soundEnabled = true;

// ===== 百度TTS朗读 =====
async function speak(text) {
    if (!soundEnabled) return;
    
    try {
        const response = await fetch('https://tsn.baidu.com/text2audio', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: 'tex=' + encodeURIComponent(text) + 
                  '&tok=24.6e4f1c8a1b2c3d4e5f6a7b8c9d0e1f2.2592000.1710000000.282335-1234567' +
                  '&ctp=1&lan=zh&spd=5&per=0'
        });
        
        if (response.ok) {
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.play();
        }
    } catch (e) {
        // 静默失败，不影响游戏
    }
}

// ===== 声音开关 =====
function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.querySelector('.header button:nth-child(4)');
    btn.textContent = soundEnabled ? '🔊 声音' : '🔇 静音';
}

// ===== 开始游戏 =====
function startGame() {
    // 获取当前单元的词库
    let words;
    if (currentUnit === 'custom') {
        words = customWords.length >= 9 ? customWords : wordBank[1];
    } else {
        words = wordBank[currentUnit];
    }
    
    // 随机抽9对
    const shuffled = [...words].sort(() => Math.random() - 0.5);
    const selected = shuffled.slice(0, 9);
    
    // 创建卡片对
    cards = [];
    selected.forEach((word, i) => {
        cards.push({ word: word, pairId: i, matched: false });
        cards.push({ word: word, pairId: i, matched: false });
    });
    
    // 洗牌
    cards.sort(() => Math.random() - 0.5);
    
    // 渲染
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    cards.forEach((card, i) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.textContent = card.word;
        div.dataset.index = i;
        div.onclick = () => handleClick(i, div);
        grid.appendChild(div);
    });
    
    // 重置状态
    selectedCard = null;
    matchedCount = 0;
    totalPairs = 9;
    document.getElementById('successOverlay').style.display = 'none';
    
    // 计时
    if (timerInterval) clearInterval(timerInterval);
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 100);
}

// ===== 点击处理 =====
function handleClick(index, element) {
    const card = cards[index];
    if (card.matched) return;
    
    // 如果已经选中同一张卡
    if (selectedCard && selectedCard.index === index) return;
    
    // 选中第一张
    if (!selectedCard) {
        selectedCard = { index: index, pairId: card.pairId, element: element };
        element.classList.add('selected');
        speak(card.word);
        return;
    }
    
    // 选中第二张
    if (selectedCard.pairId === card.pairId) {
        // 配对成功
        card.matched = true;
        cards[selectedCard.index].matched = true;
        element.classList.add('matched');
        selectedCard.element.classList.add('matched');
        element.classList.remove('selected');
        selectedCard.element.classList.remove('selected');
        matchedCount++;
        speak(card.word);
        
        if (matchedCount === totalPairs) {
            // 全部配对完成
            clearInterval(timerInterval);
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            document.getElementById('finalTime').textContent = elapsed + '秒';
            document.getElementById('successOverlay').style.display = 'flex';
        }
    } else {
        // 配对失败
        element.classList.add('wrong');
        selectedCard.element.classList.add('wrong');
        
        setTimeout(() => {
            element.classList.remove('wrong', 'selected');
            selectedCard.element.classList.remove('wrong', 'selected');
        }, 300);
    }
    
    selectedCard = null;
}

// ===== 计时器 =====
function updateTimer() {
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    document.getElementById('timer').textContent = elapsed + '秒';
}

// ===== 单元切换 =====
document.getElementById('unitSelect').addEventListener('change', function() {
    currentUnit = this.value;
    startGame();
});

// ===== 自定义词库 =====
function openCustomDialog() {
    document.getElementById('customDialog').style.display = 'flex';
    document.getElementById('customWords').value = customWords.join('\n');
}

function closeCustomDialog() {
    document.getElementById('customDialog').style.display = 'none';
}

function saveCustomWords() {
    const text = document.getElementById('customWords').value.trim();
    if (text) {
        customWords = text.split('\n').map(w => w.trim()).filter(w => w);
        currentUnit = 'custom';
        document.getElementById('unitSelect').value = 'custom';
        closeCustomDialog();
        startGame();
    }
}

// ===== 初始化 =====
startGame();
</script>
</body>
</html>
