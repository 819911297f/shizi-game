<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>生词消消乐 · 人教版四上全册</title>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.0/dist/index.js"></script>
<style>
/* ========== 基础样式 ========== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#d9f2d0}
body{display:flex;justify-content:center;align-items:center;padding:10px}

/* ========== 主容器 ========== */
.wrap{width:100%;max-width:1000px;height:100%;background:rgba(235,250,220,.85);border:2px solid #b6d7a8;border-radius:28px;padding:12px 16px;display:flex;flex-direction:column;box-shadow:0 12px 30px rgba(80,110,70,.25);overflow:hidden}

/* ========== 标题 ========== */
h1{font-size:clamp(24px,4vw,40px);color:#2d5e2c;text-align:center;font-weight:800;margin-bottom:8px;text-shadow:2px 2px 0 #c0e0b0;letter-spacing:2px}

/* ========== 控制栏 ========== */
.controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;background:#e5f4db;border:2px solid #9dc98d;border-radius:40px;padding:8px 12px;margin-bottom:8px}
select,button{font-size:14px;min-height:38px;border-radius:20px;border:2px solid #a5d69a;cursor:pointer;outline:none}
select{background:#3d7a37;color:#fff;padding:4px 10px}
.btn{background:#3d7a37;color:#fff;padding:6px 14px;box-shadow:0 3px 0 #1d461b;transition:all .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1d461b}
.status{background:#f0fae8;border:1px solid #7baa6a;border-radius:20px;padding:4px 10px;font-weight:600;color:#1e4a1a;font-size:13px}

/* ========== 计时器 ========== */
.timer{display:flex;justify-content:space-between;align-items:center;background:#e5f4db;border:2px solid #9dc98d;border-radius:40px;padding:6px 16px;margin-bottom:8px;font-weight:700;color:#1e4a1a}
#timer{background:#2c5e2a;color:#f9ffe9;padding:3px 12px;border-radius:20px;font-size:16px}
.best-time{background:#ffd700;color:#5a4a00;padding:3px 12px;border-radius:20px;font-size:13px;font-weight:bold}

/* ========== 游戏区域：固定5列网格 ========== */
.game-board{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:5px;overflow-y:auto;align-content:start}

/* ========== 泡泡：固定尺寸 ========== */
.bubble{width:100%;aspect-ratio:1/1;max-width:110px;margin:0 auto;border-radius:50%;display:flex;justify-content:center;align-items:center;text-align:center;font-size:clamp(14px,2vw,20px);font-weight:bold;color:#fff;text-shadow:1px 1px 2px rgba(0,0,0,.4);cursor:pointer;user-select:none;transition:all .15s;word-break:break-all;line-height:1.2;padding:4px;box-shadow:0 6px 10px rgba(0,0,0,.2),inset 0 -4px 8px rgba(0,0,0,.15),inset 0 4px 8px rgba(255,255,255,.4)}
.bubble:active{transform:scale(.92)}
.bubble.selected{border:3px solid #ffe484;box-shadow:0 0 0 3px #ffe484,0 6px 12px rgba(0,0,0,.3)}

/* 已匹配的泡泡：直接隐藏，不播放动画 */
.bubble.matched{visibility:hidden;opacity:0;pointer-events:none;transform:scale(0)}

/* ========== 底部按钮 ========== */
.bottom-area{margin-top:8px;text-align:center}
.btn-primary{background:#2d5e2c;color:#fff;border:none;padding:10px 30px;border-radius:25px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #1a3a18;transition:all .1s;width:80%;max-width:280px}
.btn-primary:active{transform:translateY(2px);box-shadow:0 2px 0 #1a3a18}
.hint{margin-top:6px;font-size:12px;color:#666}

/* ========== 弹窗 ========== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999}
.modal-box{background:#f0fae8;border-radius:18px;padding:18px;width:100%;max-width:500px;max-height:90vh;overflow:auto}
.modal-box h3{color:#2d5e2c;margin-bottom:10px}
.modal-box textarea{width:100%;height:120px;border:2px solid #9dc98d;border-radius:10px;padding:10px;font-size:16px;resize:vertical;font-family:inherit}
.preview{background:#e8f5e1;border-radius:10px;padding:8px;margin:8px 0;white-space:pre-wrap;font-size:14px;color:#1e4a1a;max-height:150px;overflow:auto}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.modal-btn{border:none;padding:8px 20px;border-radius:20px;color:#fff;font-weight:bold;cursor:pointer;min-height:40px}
.modal-btn.cancel{background:#aaa}
.modal-btn.confirm{background:#3d7a37}

/* ========== 声音解锁提示 ========== */
#sound-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;color:#fff;font-size:20px;text-align:center;padding:20px}
#sound-overlay.hidden{display:none}
#sound-overlay .icon{font-size:60px;margin-bottom:20px}
#sound-overlay .btn-unlock{background:#3d7a37;color:#fff;border:none;padding:15px 40px;border-radius:30px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:20px;box-shadow:0 4px 0 #1d461b}

/* ========== 响应式 ========== */
@media (max-width:600px){.game-board{grid-template-columns:repeat(4,1fr)}}
@media (max-width:400px){.game-board{grid-template-columns:repeat(3,1fr)}}
@media (min-width:768px){.bubble{font-size:18px}}
</style>
</head>
<body>

<div class="wrap">
    <h1>✨ 生词消消乐 ✨</h1>
    
    <div class="controls">
        <span style="font-size:14px;color:#2d5e2c">📚 人教版四上：</span>
        <select id="unit-select">
            <option value="u1">第一单元</option>
            <option value="u2">第二单元</option>
            <option value="u3">第三单元</option>
            <option value="u4">第四单元</option>
            <option value="u5">第五单元</option>
            <option value="u6">第六单元</option>
            <option value="u7">第七单元</option>
            <option value="u8">第八单元</option>
        </select>
        <button class="btn" id="apply-btn">✅ 应用</button>
        <button class="btn" id="custom-btn">📝 自定义词库</button>
        <span class="status" id="status">第一单元</span>
    </div>

    <div class="timer">
        <span>⏱️ 用时</span>
        <span id="timer">0.0 秒</span>
        <span class="best-time" id="best-time">🏆 最快：--</span>
    </div>

    <div class="game-board" id="game-board"></div>

    <div class="bottom-area">
        <button class="btn-primary" id="next-btn">🔁 继续挑战</button>
        <div class="hint" id="hint">点击泡泡配对 · 成功立刻朗读 🔊</div>
    </div>
</div>

<!-- 声音解锁提示 -->
<div id="sound-overlay">
    <div class="icon">🔊</div>
    <p id="sound-tip">点击下方按钮开启声音</p>
    <button class="btn-unlock" id="unlock-btn">开启声音</button>
</div>

<script>
/* ========== 人教版四上全册词库 ========== */

    u5:{name:'第五单元', words:['嗅到','无可奈何','巢穴','身躯','拯救','幼小','嘶哑','庞大','愣住','准备','凌空','搏斗','摇撼']},

    u7:{name:'第七单元', words:['出塞','秦朝','征战','歌词','催促','陶醉','杰出','亦然','英雄','项羽']},
    u8:{name:'第八单元', words:['豹子','娶亲','媳妇','淹没','逼迫','干旱','跪下','绸缎','徒弟','流淌','巫师','绅士','吊灯','倒塌','开凿','渠道','灌溉']}
};

/* ========== 拼音转换（带声调） ========== */
function getPinyin(text) {
    try {
        if (window.pinyinPro) {
            return window.pinyinPro.pinyin(text, { toneType: 'symbol', type: 'array' }).join(' ');
        }
    } catch(e) {}
    
    // 兜底映射
    const map = {
        '潮':'cháo','观':'guān','据':'jù','堤':'dī','阔':'kuò','笼':'lóng','罩':'zhào','盼':'pàn',
        '滚':'gǔn','逐':'zhú','渐':'jiàn','犹':'yóu','淘':'táo','牵':'qiān','鹅':'é','卵':'luǎn',
        '坑':'kēng','洼':'wā','填':'tián','庄':'zhuāng','稼':'jià','俗':'sú','跃':'yuè','葡':'pú',
        '萄':'táo','稻':'dào','熟':'shú','巢':'cháo','苇':'wěi','罗':'luó','眠':'mián','霸':'bà',
        '占':'zhàn','豌':'wān','按':'àn','僵':'jiāng','预':'yù','揭':'jiē','啪':'pā','苔':'tái',
        '囚':'qiú','框':'kuàng','溢':'yì','舒':'shū','适':'shì','恐':'kǒng','硬':'yìng','枪':'qiāng',
        '耐':'nài','探':'tàn','愉':'yú','曾':'céng','蝙':'biān','蝠':'fú','启':'qǐ','即':'jí',
        '锐':'ruì','系':'xì','铛':'dāng','蝇':'yíng','证':'zhèng','障':'zhàng','荧':'yíng','屏':'píng',
        '达':'dá','蚊':'wén','科':'kē','横':'héng','竖':'shù','绳':'shéng','研':'yán','究':'jiū',
        '驾':'jià','驶':'shǐ','唤':'huàn','技':'jì','获':'huò','赖':'lài','潜':'qián','亿':'yì',
        '索':'suǒ','奥':'ào','舶':'bó','质':'zhì','哲':'zhé','兰':'lán','纪':'jì','改':'gǎi',
        '程':'chéng','超':'chāo','益':'yì','联':'lián','任':'rèn','善':'shàn','暮':'mù','瑟':'sè',
        '缘':'yuán','降':'xiáng','骚':'sāo','逊':'xùn','输':'shū','吟':'yín','题':'tí','侧':'cè',
        '峰':'fēng','庐':'lú','阁':'gé','费':'fèi','须':'xū','虎':'hǔ','操':'cāo','嫩':'nèn',
        '顺':'shùn','均':'jūn','叠':'dié','隙':'xì','茎':'jīng','柄':'bǐng','萎':'wěi','瞧':'qiáo',
        '固':'gù','蜗':'wō','曲':'qū','宅':'zhái','隐':'yǐn','毫':'háo','慎':'shèn','址':'zhǐ',
        '良':'liáng','掘':'jué','搜':'sōu','倾':'qīng','骤':'zhòu','置':'zhì','抛':'pāo','劈':'pī',
        '浊':'zhuó','丈':'zhàng','隆':'lóng','肢':'zhī','躯':'qū','液':'yè','缓':'huǎn','撑':'chēng',
        '竭':'jié','累':'lèi','血':'xuè','茂':'mào','滋':'zī','宗':'zōng','帝':'dì','少':'shào',
        '曰':'yuē','溺':'nì','返':'fǎn','堙':'yīn','斯':'sī','惨':'cǎn','盗':'dào','败':'bài',
        '惩':'chéng','佩':'pèi','恕':'shù','锁':'suǒ','遭':'zāo','恶':'è','愤':'fèn','悲':'bēi',
        '兽':'shòu','坚':'jiān','违':'wéi','抗':'kàng','环':'huán','既':'jì','狠':'hěn','著':'zhù',
        '嗅':'xiù','奈':'nài','拯':'zhěng','幼':'yòu','嘶':'sī','哑':'yǎ','庞':'páng','愣':'lèng',
        '备':'bèi','凌':'líng','搏':'bó','摇':'yáo','撼':'hàn','谓':'wèi','拳':'quán','捶':'chuí',
        '顽':'wán','脱':'tuō','惹':'rě','昏':'hūn','握':'wò','摔':'shuāi','凭':'píng','掐':'qiā',
        '怖':'bù','斑':'bān','驼':'tuó','羡':'xiàn','慕':'mù','塞':'sài','秦':'qín','征':'zhēng',
        '词':'cí','催':'cuī','醉':'zuì','杰':'jié','亦':'yì','雄':'xióng','项':'xiàng','豹':'bào',
        '娶':'qǔ','媳':'xí','妇':'fù','淹':'yān','逼':'bī','旱':'hàn','跪':'guì','绸':'chóu',
        '徒':'tú','淌':'tǎng','巫':'wū','绅':'shēn','吊':'diào','塌':'tā','凿':'záo','开':'kāi',
        '渠':'qú','灌':'guàn'
    };
    return text.split('').map(c => map[c] || c).join(' ');
}

/* ========== 语音功能（在线TTS方案） ========== */
let soundEnabled = false;
let currentAudio = null;

function unlockSound() {
    soundEnabled = true;
    document.getElementById('sound-overlay').classList.add('hidden');
    // 播放测试音
    speak('声音已开启');
}

function speak(text) {
    if (!soundEnabled) return;
    
    // 使用在线TTS服务（免费，无需API Key）
    // 这里使用 Google Translate TTS 接口（免费且稳定）
    const url = 'https://translate.google.com/translate_tts?ie=UTF-8&q=' + encodeURIComponent(text) + '&tl=zh-CN&client=tw-ob';
    
    // 停止之前的音频
    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }
    
    // 播放新的音频
    currentAudio = new Audio(url);
    currentAudio.play().catch(e => {
        console.log('在线TTS播放失败，尝试备用方案');
        // 备用：使用 Web Audio 提示音
        playFallbackBeep();
    });
}

// 备用提示音
function playFallbackBeep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 523.25;
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
}

/* ========== 游戏状态 ========== */
let currentList = [];
let gameItems = [];
let selected = null;
let timer = null;
let startTime = 0;
let finished = false;
let lastTime = null;
let bestTime = null;

const $ = id => document.getElementById(id);
const gameBoard = $('game-board');

/* ========== 初始化 ========== */
function init() {
    $('apply-btn').onclick = () => useUnit($('unit-select').value);
    $('next-btn').onclick = newGame;
    $('custom-btn').onclick = showCustomModal;
    $('unlock-btn').onclick = unlockSound;
    
    useUnit('u1');
}

/* ========== 使用内置单元 ========== */
function useUnit(key) {
    const unit = BOOK[key];
    if (!unit) return;
    
    currentList = [];
    unit.words.forEach(word => {
        const py = getPinyin(word);
        if (py) currentList.push({ text: word, py: py });
    });
    
    $('status').textContent = unit.name;
    newGame();
}

/* ========== 自定义词库 ========== */
function showCustomModal() {
    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.innerHTML = `
        <div class="modal-box">
            <h3>📝 自定义词库</h3>
            <p style="font-size:13px;color:#1e4a1a;margin-bottom:8px">每行一个，支持汉字、词语：<br>潮<br>观潮<br>爬山虎</p>
            <textarea id="custom-input" placeholder="潮&#10;观潮&#10;爬山虎"></textarea>
            <div class="preview" id="custom-preview">输入后点击"转换"查看拼音</div>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="cancel-btn">取消</button>
                <button class="modal-btn confirm" id="convert-btn">🔄 转换</button>
                <button class="modal-btn confirm" id="ok-btn">✅ 用这个词库</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    
    const input = modal.querySelector('#custom-input');
    const preview = modal.querySelector('#custom-preview');
    let convertedList = [];
    
    modal.querySelector('#convert-btn').onclick = () => {
        const lines = input.value.split('\n').map(s => s.trim()).filter(Boolean);
        if (!lines.length) { alert('请输入内容'); return; }
        
        convertedList = [];
        let output = '';
        lines.forEach(line => {
            const py = getPinyin(line);
            if (py) {
                convertedList.push({ text: line, py: py });
                output += line + ' → ' + py + '\n';
            } else {
                output += '❌ ' + line + ' 无法识别\n';
            }
        });
        preview.textContent = output;
    };
    
    modal.querySelector('#cancel-btn').onclick = () => modal.remove();
    
    modal.querySelector('#ok-btn').onclick = () => {
        if (!convertedList.length) {
            alert('请先点击"转换"生成拼音');
            return;
        }
        currentList = convertedList;
        $('status').textContent = '自定义词库（' + currentList.length + '条）';
        modal.remove();
        newGame();
    };
}

/* ========== 新游戏 ========== */
function newGame() {
    if (!currentList.length) return;
    
    const pool = [...currentList].sort(() => Math.random() - 0.5).slice(0, 9);
    gameItems = [];
    
    pool.forEach((item, i) => {
        gameItems.push({ key: i, text: item.text, py: item.py, side: 'text', matched: false });
        gameItems.push({ key: i, text: item.text, py: item.py, side: 'py', matched: false });
    });
    
    gameItems.sort(() => Math.random() - 0.5);
    
    selected = null;
    finished = false;
    renderBoard();
    startTimer();
}

/* ========== 渲染 ========== */
function renderBoard() {
    gameBoard.innerHTML = '';
    
    gameItems.forEach((item, index) => {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        
        if (item.matched) {
            bubble.classList.add('matched');
        }
        
        if (selected === index) {
            bubble.classList.add('selected');
        }
        
        const colors = [
            ['#8ecae6', '#219ebc'],
            ['#ffb703', '#fb8500'],
            ['#06d6a0', '#118ab2'],
            ['#ef476f', '#ffd166'],
            ['#9b5de5', '#f15bb5'],
            ['#00bbf9', '#00f5d4'],
            ['#fee440', '#9b5de5']
        ];
        const color = colors[Math.floor(Math.random() * colors.length)];
        bubble.style.background = `radial-gradient(circle at 30% 30%, rgba(255,255,255,.8), rgba(255,255,255,0) 40%), linear-gradient(145deg, ${color[0]}, ${color[1]})`;
        
        bubble.textContent = item.side === 'text' ? item.text : item.py;
        bubble.onclick = () => handleClick(index);
        
        gameBoard.appendChild(bubble);
    });
}

/* ========== 点击处理 ========== */
function handleClick(index) {
    if (finished || gameItems[index].matched) return;
    
    if (selected === null) {
        selected = index;
        renderBoard();
        return;
    }
    
    if (selected === index) {
        selected = null;
        renderBoard();
        return;
    }
    
    const a = gameItems[selected];
    const b = gameItems[index];
    
    if (a.key === b.key && a.side !== b.side) {
        a.matched = true;
        b.matched = true;
        
        // 朗读匹配的词语（核心功能）
        speak(a.text);
        
        setTimeout(() => {
            selected = null;
            renderBoard();
            
            if (gameItems.every(item => item.matched)) {
                win();
            }
        }, 100);
    } else {
        selected = null;
        renderBoard();
    }
}

/* ========== 胜利 ========== */
function win() {
    finished = true;
    stopTimer();
    const time = ((performance.now() - startTime) / 1000).toFixed(1);
    
    if (bestTime === null || parseFloat(time) < bestTime) {
        bestTime = parseFloat(time);
        $('best-time').textContent = '🏆 最快：' + bestTime.toFixed(1) + ' 秒';
    }
    
    let comment = '';
    if (lastTime === null) {
        comment = '太棒了，完成了挑战！';
    } else if (parseFloat(time) < lastTime) {
        comment = '真厉害，比上次更快了！';
    } else {
        comment = '没关系，继续加油！';
    }
    
    lastTime = parseFloat(time);
    
    setTimeout(() => {
        alert('🎉 恭喜挑战成功！用时 ' + time + ' 秒\n' + comment);
        speak('恭喜挑战成功');
        setTimeout(() => {
            speak(comment);
        }, 1500);
    }, 1500);
}

/* ========== 计时器 ========== */
function startTimer() {
    stopTimer();
    startTime = performance.now();
    timer = setInterval(() => {
        $('timer').textContent = ((performance.now() - startTime) / 1000).toFixed(1) + ' 秒';
    }, 100);
}

function stopTimer() {
    clearInterval(timer);
}

/* ========== 启动 ========== */
init();
</script>
